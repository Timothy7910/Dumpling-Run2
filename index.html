<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>團子快跑</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="game-body">
    <main class="app">
      <section class="topbar" aria-labelledby="title">
        <div>
          <p class="eyebrow">互動版・圓形賽道</p>
          <div class="title-row">
            <h1 id="title">團子快跑</h1>
            <select id="groupSelect" class="group-select" aria-label="小組切換">
              <option value="a">A組</option>
              <option value="b">B組</option>
              <option value="c">C組</option>
            </select>
            <select id="trackSelect" class="group-select track-select" aria-label="地圖切換"></select>
          </div>
        </div>
        <div class="controls" aria-label="遊戲控制">
          <button id="customGroupButton" class="ghost custom-group-button" type="button">自訂</button>
          <button id="newGameButton" type="button">新比賽</button>
        </div>
      </section>

      <section class="play-layout">
        <div class="stage-panel">
          <div id="stage" class="stage" aria-label="圓形賽道遊戲區">
            <div id="stageRanking" class="stage-ranking" aria-live="polite"></div>
            <div id="turnOrder" class="turn-order" aria-live="polite"></div>
            <div class="stage-controls" aria-label="回合控制">
              <button id="stepButton" type="button">擲下一顆</button>
              <button id="autoButton" type="button">自動跑完</button>
            </div>
            <div class="track-ring" aria-hidden="true"></div>
            <div id="cells" class="cells"></div>
            <div id="pieces" class="pieces"></div>
            <div id="movers" class="movers"></div>
            <div id="dice" class="dice dice-gem" aria-live="polite">?</div>
          </div>
        </div>

        <aside class="side-panel">
          <div class="panel-head">
            <h2>本場順位</h2>
            <span class="subtle">布大王不排名</span>
          </div>
          <div id="players" class="players"></div>
        </aside>
      </section>

      <section class="lower-grid">
        <div class="panel">
          <div class="panel-head">
            <h2>事件紀錄</h2>
            <button id="clearLogButton" class="ghost" type="button">清空</button>
          </div>
          <div id="log" class="log" aria-live="polite"></div>
        </div>

        <div class="panel sim-panel">
          <div class="panel-head">
            <h2>勝率模擬</h2>
            <span class="subtle">大量快速模擬</span>
          </div>
          <div class="sim-controls">
            <label>
              模擬場數
              <input id="simCount" type="number" min="100" max="100000" step="100" value="5000">
            </label>
            <button id="simulateButton" type="button">計算勝率</button>
          </div>
          <div id="simResults" class="sim-results"></div>
        </div>
      </section>
    </main>

    <div id="endModal" class="end-modal" role="dialog" aria-modal="true" aria-labelledby="endTitle" hidden>
      <div class="end-card">
        <h2 id="endTitle">比賽結果</h2>
        <div id="endRankings" class="end-rankings"></div>
        <button id="endOkButton" type="button">確認</button>
      </div>
    </div>

    <div id="customModal" class="custom-modal" role="dialog" aria-modal="true" aria-labelledby="customTitle" hidden>
      <div class="custom-card">
        <div class="custom-head">
          <div>
            <h2 id="customTitle">自訂參賽團子</h2>
            <p>從 A、B、C 組共 18 顆中選 6 顆</p>
          </div>
          <div class="custom-head-controls">
            <label class="custom-track-control">
              地圖
              <select id="customTrackSelect" class="group-select track-select" aria-label="自訂比賽地圖切換"></select>
            </label>
            <span id="customCount" class="pill">0/6</span>
          </div>
        </div>
        <div id="customGrid" class="custom-grid"></div>
        <div class="custom-actions">
          <button id="customResetOrderButton" class="ghost" type="button">重置排序</button>
          <button id="customCancelButton" class="ghost" type="button">取消</button>
          <button id="customSaveButton" type="button" disabled>開始自訂比賽</button>
        </div>
      </div>
    </div>

    <script src="track-data.js"></script>
    <script src="game.js"></script>
  </body>
</html>
